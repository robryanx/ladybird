<!DOCTYPE html>
<style>
html, body {
    margin: 0;
}

#scene {
    position: relative;
    width: 320px;
    height: 200px;
}

#status {
    anchor-name: --status;
    position: absolute;
    left: 60px;
    top: 160px;
    width: 200px;
    height: 40px;
}

#weapon {
    position: absolute;
    position-anchor: --status;
    left: anchor(center);
    bottom: anchor(top);
    width: 60px;
    height: 30px;
    margin-left: -30px;
}
</style>
<div id="scene"><div id="status"></div><div id="weapon"></div></div>
